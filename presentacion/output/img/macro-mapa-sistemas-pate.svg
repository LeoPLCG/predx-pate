<svg id="macro-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="st sd"><title id="st">Macro mapa de sistemas PATE: SAP central e información fragmentada</title><desc id="sd">Seis dominios satélite alrededor de SAP sin interfaces automáticas acreditadas. Flujos manuales de papel, WhatsApp, Excel y tablero, y ausencia de un repositorio integrado por validar.</desc><style>text{font-family:Arial,sans-serif}.num{font-size:12px;fill:#8290a5;font-weight:700}.ct{font-size:17px;fill:#162944;font-weight:700}.sub{font-size:12px;fill:#66758b}.tag{font-size:8px;fill:#68563c;font-weight:700}.row{font-size:12px;fill:#31445c}.foot{font-size:10px;fill:#718097}</style><rect width="1200" height="850" fill="#f5f7fb"></rect><ellipse cx="600" cy="295" rx="208" ry="251" fill="none" stroke="#dbe3ed" stroke-dasharray="4 8"></ellipse><text x="600" y="64" text-anchor="middle" font-size="11" fill="#75849a" letter-spacing="1.2">ECOSISTEMA DE INFORMACIÓN FRAGMENTADO</text><path d="M350 116 L390 116 L425 295 L461 295 M739 295 L775 295 L810 116 L850 116" fill="none" stroke="#bdc8d7" stroke-width="1.5" stroke-dasharray="5 5"></path><path d="M350 298 L390 298 L425 295 L461 295 M739 295 L775 295 L810 298 L850 298" fill="none" stroke="#bdc8d7" stroke-width="1.5" stroke-dasharray="5 5"></path><path d="M350 480 L390 480 L425 295 L461 295 M739 295 L775 295 L810 480 L850 480" fill="none" stroke="#bdc8d7" stroke-width="1.5" stroke-dasharray="5 5"></path><rect x="440" y="189" width="320" height="216" rx="16" fill="#132d50"></rect><rect x="460" y="209" width="76" height="23" rx="4" fill="#294b76"></rect><text x="498" y="225" text-anchor="middle" fill="#d6e7ff" font-size="10" font-weight="bold">NÚCLEO ERP</text><text x="600" y="283" text-anchor="middle" font-size="49" font-weight="bold" fill="white">SAP</text><text x="600" y="310" text-anchor="middle" font-size="13" fill="#dbe6f4">Centro transaccional referido en la libreta</text><path d="M465 328 H735" stroke="#365071"></path><text x="600" y="350" text-anchor="middle" font-size="12" fill="#dbe6f4">Material de empaque registrado</text><text x="600" y="373" text-anchor="middle" font-size="11" fill="#adbed5">Sin flujo integrado de punta a punta acreditado</text><rect x="423" y="443" width="354" height="83" rx="8" fill="#fff8eb" stroke="#e5d3ad"></rect><text x="600" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#80602c">BRECHA DE INTEGRACIÓN</text><text x="600" y="491" text-anchor="middle" font-size="12" fill="#80602c">Interfaces automáticas entre SAP y satélites</text><text x="600" y="510" text-anchor="middle" font-size="11" fill="#80602c">no acreditadas en este levantamiento</text><g transform="translate(40,42)"><rect width="310" height="148" rx="10" fill="white" stroke="#d7dfe9"></rect><text x="18" y="27" class="num">01</text><text x="48" y="28" class="ct">Comercial</text><text x="18" y="51" class="sub">Información fuera del núcleo ERP</text><rect x="18" y="65" width="57" height="20" rx="4" fill="#f7eedf"></rect><text x="46" y="79" text-anchor="middle" class="tag">EXCEL</text><text x="84" y="79" class="row">Precio de venta / PT</text><rect x="18" y="92" width="57" height="20" rx="4" fill="#f7eedf"></rect><text x="46" y="106" text-anchor="middle" class="tag">NOTAS</text><text x="84" y="106" class="row">Información comercial dispersa</text><text x="18" y="133" class="foot">Libreta · validar alcance e interfaces</text></g><g transform="translate(40,224)"><rect width="310" height="148" rx="10" fill="white" stroke="#d7dfe9"></rect><text x="18" y="27" class="num">02</text><text x="48" y="28" class="ct">Almacenes y congelación</text><text x="18" y="51" class="sub">Control operativo por área</text><rect x="18" y="65" width="57" height="20" rx="4" fill="#f7eedf"></rect><text x="46" y="79" text-anchor="middle" class="tag">EXCEL</text><text x="84" y="79" class="row">Movimientos y controles básicos</text><rect x="18" y="92" width="57" height="20" rx="4" fill="#f7eedf"></rect><text x="46" y="106" text-anchor="middle" class="tag">PAPEL</text><text x="84" y="106" class="row">Registros de temperatura</text><text x="18" y="133" class="foot">Libreta · material de empaque sí en SAP</text></g><g transform="translate(40,406)"><rect width="310" height="148" rx="10" fill="white" stroke="#d7dfe9"></rect><text x="18" y="27" class="num">03</text><text x="48" y="28" class="ct">Producción y abasto</text><text x="18" y="51" class="sub">Cobertura digital heterogénea</text><rect x="18" y="65" width="57" height="20" rx="4" fill="#e8eefb"></rect><text x="46" y="79" text-anchor="middle" class="tag">SISTEMA</text><text x="84" y="79" class="row">Marel: deshuese 2</text><rect x="18" y="92" width="57" height="20" rx="4" fill="#f7eedf"></rect><text x="46" y="106" text-anchor="middle" class="tag">MANUAL</text><text x="84" y="106" class="row">Deshuese 1 / pesos / abasto</text><text x="18" y="133" class="foot">Entrevista 14:06-17:13, 52:40, 1:02:06</text></g><g transform="translate(850,42)"><rect width="310" height="148" rx="10" fill="white" stroke="#d7dfe9"></rect><text x="18" y="27" class="num">04</text><text x="48" y="28" class="ct">Planeación y seguimiento</text><text x="18" y="51" class="sub">Herramientas satélite</text><rect x="18" y="65" width="57" height="20" rx="4" fill="#e8eefb"></rect><text x="46" y="79" text-anchor="middle" class="tag">SISTEMA</text><text x="84" y="79" class="row">Planner: compras / proyectos</text><rect x="18" y="92" width="57" height="20" rx="4" fill="#e8eefb"></rect><text x="46" y="106" text-anchor="middle" class="tag">SISTEMA</text><text x="84" y="106" class="row">Tablero KPI: “Ritmo”</text><text x="18" y="133" class="foot">Libreta + entrevista 58:07-1:00:13</text></g><g transform="translate(850,224)"><rect width="310" height="148" rx="10" fill="white" stroke="#d7dfe9"></rect><text x="18" y="27" class="num">05</text><text x="48" y="28" class="ct">Mantenimiento</text><text x="18" y="51" class="sub">Avisos y gestión distribuida</text><rect x="18" y="65" width="57" height="20" rx="4" fill="#e8eefb"></rect><text x="46" y="79" text-anchor="middle" class="tag">SISTEMA</text><text x="84" y="79" class="row">WhatsApp: reporte de fallas</text><rect x="18" y="92" width="57" height="20" rx="4" fill="#f7eedf"></rect><text x="46" y="106" text-anchor="middle" class="tag">MANUAL</text><text x="84" y="106" class="row">Tickets / tablet / Infor EAM*</text><text x="18" y="133" class="foot">Entrevista 38:53-40:57 + libreta*</text></g><g transform="translate(850,406)"><rect width="310" height="148" rx="10" fill="white" stroke="#d7dfe9"></rect><text x="18" y="27" class="num">06</text><text x="48" y="28" class="ct">Calidad y productividad</text><text x="18" y="51" class="sub">Datos disponibles con alcance parcial</text><rect x="18" y="65" width="57" height="20" rx="4" fill="#e8eefb"></rect><text x="46" y="79" text-anchor="middle" class="tag">SISTEMA</text><text x="84" y="79" class="row">Marel: estación de calidad</text><rect x="18" y="92" width="57" height="20" rx="4" fill="#f7eedf"></rect><text x="46" y="106" text-anchor="middle" class="tag">EXCEL</text><text x="84" y="106" class="row">Defectos fuera de Marel*</text><text x="18" y="133" class="foot">Entrevista 53:03-56:21 + libreta*</text></g><text x="40" y="591" font-size="12" font-weight="bold" fill="#273d58" letter-spacing="1">EL FLUJO MANUAL COMPROBADO</text><rect x="40" y="610" width="232" height="71" rx="8" fill="#fff" stroke="#d7dfe9"></rect><text x="56" y="637" font-size="15" fill="#243b58" font-weight="bold">Papel + WhatsApp</text><text x="56" y="659" font-size="11" fill="#68778b">Pesos, paros y avisos de fallas</text><path d="M282 645 H322 l-7 -5 m7 5 l-7 5" fill="none" stroke="#b98134" stroke-width="2"></path><rect x="336" y="610" width="232" height="71" rx="8" fill="#fff" stroke="#d7dfe9"></rect><text x="352" y="637" font-size="15" fill="#243b58" font-weight="bold">Consolidación humana</text><text x="352" y="659" font-size="11" fill="#68778b">Personal de apoyo revisa y transcribe</text><path d="M578 645 H618 l-7 -5 m7 5 l-7 5" fill="none" stroke="#b98134" stroke-width="2"></path><rect x="632" y="610" width="232" height="71" rx="8" fill="#fff" stroke="#d7dfe9"></rect><text x="648" y="637" font-size="15" fill="#243b58" font-weight="bold">Excel</text><text x="648" y="659" font-size="11" fill="#68778b">Consolidación / cálculos</text><path d="M874 645 H914 l-7 -5 m7 5 l-7 5" fill="none" stroke="#b98134" stroke-width="2"></path><rect x="928" y="610" width="232" height="71" rx="8" fill="#fff" stroke="#d7dfe9"></rect><text x="944" y="637" font-size="15" fill="#243b58" font-weight="bold">Tablero KPI</text><text x="944" y="659" font-size="11" fill="#68778b">Nueva captura de indicadores</text><text x="40" y="704" font-size="11" fill="#718097">Flujo compuesto de la entrevista: 38:53-40:57 · 1:00:01-1:00:13 · 1:02:06. No representa una interfaz tecnológica.</text><rect x="40" y="727" width="1120" height="92" rx="8" fill="#e9eef5"></rect><text x="60" y="755" font-size="15" fill="#273e5b" font-weight="bold">Sin una capa de datos integrada evidenciada</text><text x="60" y="779" font-size="13" fill="#4e627c">No se acreditó un data lake, data warehouse o repositorio corporativo que consolide las fuentes operativas.</text><text x="60" y="800" font-size="11" fill="#687c95">Hipótesis del prediagnóstico · confirmar arquitectura, interfaces, propietarios y fuentes oficiales con TI.</text></svg>